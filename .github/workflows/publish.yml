name: Publish site and map

on:
  schedule:
    # Every 8 hours: 03:17, 11:17 and 19:17 UTC. Off the hour: GitHub delays top-of-the-hour
    # cron runs the most.
    - cron: '17 3,11,19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'tools/**', '.github/workflows/publish.yml']

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_SFTP: ${{ secrets.MC_SFTP_KEY != '' && secrets.MC_SFTP_USER != '' }}
      MAP_CACHE_DIR: ${{ github.workspace }}/../map-cache
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Only the small per-region biome grids and the remote manifest are cached between runs
      # (MAP_KEEP_RAW=0 deletes the raw region files), so each night downloads just the regions
      # that changed. The cache is saved right after a good refresh, so a later failing step
      # (snapshot) doesn't throw the work away and force a full re-download next run.
      - name: Restore map cache
        if: env.HAS_SFTP == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.MAP_CACHE_DIR }}
          key: map-cache-${{ github.run_id }}
          restore-keys: map-cache-

      # A failed pull (key revoked, server down) still publishes the site with the current live
      # map data; the last step then marks the run failed so it shows up red.
      - name: Pull changed regions and rebuild the map (read-only SFTP)
        id: refresh
        if: env.HAS_SFTP == 'true'
        continue-on-error: true
        env:
          MC_SFTP_USER: ${{ secrets.MC_SFTP_USER }}
          MC_SFTP_KEY: ${{ secrets.MC_SFTP_KEY }}
          MAP_KEEP_RAW: '0'
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/sftp_key"
          printf '%s\n' "$MC_SFTP_KEY" > "$RUNNER_TEMP/sftp_key"
          export MC_SFTP_KEY_FILE="$RUNNER_TEMP/sftp_key"
          node tools/sync-regions.mjs
          node tools/build-map.mjs
          rm -f "$RUNNER_TEMP/sftp_key"

      - name: Save map cache
        if: steps.refresh.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.MAP_CACHE_DIR }}
          key: map-cache-${{ github.run_id }}

      - name: No SFTP secrets, publishing site code with the current live map data
        if: env.HAS_SFTP != 'true'
        run: echo "MC_SFTP_KEY / MC_SFTP_USER not set; skipping the map refresh."

      - name: Unit tests
        run: npm test

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/publish.mjs

      # After publishing, so a failed snapshot never holds back the live map.
      - name: Snapshot the map to map-history (timelapse)
        id: snapshot
        if: steps.refresh.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/snapshot-map.mjs

      - name: Report a failed snapshot
        if: steps.snapshot.outcome == 'failure'
        run: |
          echo "::error::Map snapshot failed (see the 'Snapshot the map' step). The site and map were published."
          exit 1

      - name: Report a failed map refresh
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error::Map refresh failed (see the 'Pull changed regions' step). The site was published with the previous map data."
          exit 1
